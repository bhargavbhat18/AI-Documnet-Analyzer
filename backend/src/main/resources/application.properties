spring.application.name=backend
server.port=${PORT:8081}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/document_analyzer?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bgb@2004}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring AI OpenAI (Chat only - exclude embeddings to avoid conflict)
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiEmbeddingAutoConfiguration
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${SPRING_AI_OPENAI_CHAT_MODEL:gpt-4o-mini}

# Spring AI Cohere (for embeddings - uses OpenAI compatibility endpoint at /compatibility/v1)
spring.ai.cohere.api-key=${SPRING_AI_COHERE_API_KEY:}
spring.ai.cohere.embedding.options.model=${SPRING_AI_COHERE_EMBEDDING_MODEL:embed-english-v3.0}

# ChromaDB
spring.ai.vectorstore.chroma.client.host=${SPRING_AI_VECTORSTORE_CHROMA_CLIENT_HOST:http://localhost}
spring.ai.vectorstore.chroma.client.port=${SPRING_AI_VECTORSTORE_CHROMA_CLIENT_PORT:8000}
spring.ai.vectorstore.chroma.collection-name=document_chunks
spring.ai.vectorstore.chroma.initialize-schema=true

# CORS configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:*}

# File Upload limit
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
