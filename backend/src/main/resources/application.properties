spring.application.name=backend
server.port=${PORT:8081}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/document_analyzer?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bgb@2004}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring AI Ollama
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${SPRING_AI_OLLAMA_CHAT_MODEL:llama3.2}
spring.ai.ollama.embedding.options.model=${SPRING_AI_OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# ChromaDB
spring.ai.vectorstore.chroma.client.host=${SPRING_AI_VECTORSTORE_CHROMA_CLIENT_HOST:http://localhost}
spring.ai.vectorstore.chroma.client.port=${SPRING_AI_VECTORSTORE_CHROMA_CLIENT_PORT:8000}
spring.ai.vectorstore.chroma.collection-name=document_chunks
spring.ai.vectorstore.chroma.initialize-schema=true

# CORS configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:*}

# File Upload limit
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
