services:
  chromadb:
    image: chromadb/chroma:0.5.11
    container_name: document_analyzer_chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    restart: always

  mysql:
    image: mysql:8.0
    container_name: document_analyzer_mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=document_analyzer
      - MYSQL_USER=analyzer_user
      - MYSQL_PASSWORD=analyzer_pass
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  chroma_data:
  mysql_data:
